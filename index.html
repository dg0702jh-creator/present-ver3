 <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>댕댕이의 미니게임 천국</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; }
        .progress-bar { transition: width 0.1s linear; }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-amber-200">

    <header class="w-full max-w-md bg-white rounded-2xl shadow-md p-3 text-center border-2 border-amber-200 flex flex-col gap-2">
        <div class="flex justify-between items-center w-full">
            <span id="level-display" class="text-lg text-amber-600 font-bold">🐶 LV. 1 모험</span>
            <div class="flex gap-1.5">
                <button id="show-ticket-box-btn" class="text-xs bg-purple-100 text-purple-800 px-2.5 py-1 rounded-lg hover:bg-purple-200 font-bold hidden">🎟️ 티켓함</button>
                <button id="show-rate-btn" class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg hover:bg-amber-200 font-bold">📊 확률표</button>
            </div>
        </div>
        <div class="flex justify-between items-center text-xs text-slate-500 px-1">
            <span id="stage-display">1단계 미션 진행중</span>
            <span id="ticket-display" class="bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded-full">🎟️ 뽑기권: 0개</span>
        </div>
        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden border border-slate-300">
            <div id="level-progress" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-3">
        <div id="tab-container" class="w-full flex gap-2 mb-3">
            <button id="tab-game" class="flex-1 py-2 rounded-xl bg-amber-500 text-white shadow-md text-base font-bold">🎮 게임 플레이</button>
            <button id="tab-gacha" class="flex-1 py-2 rounded-xl bg-slate-200 text-slate-600 shadow-md text-base font-bold">🔮 캡슐 뽑기</button>
        </div>

        <div id="game-panel" class="w-full bg-white rounded-3xl shadow-xl border-4 border-amber-300 p-5 flex flex-col items-center justify-between min-h-[420px]">
            <div id="game-content" class="w-full flex-1 flex flex-col items-center justify-center text-center"></div>
            <div id="game-controls" class="w-full mt-3 flex flex-col gap-2 justify-center"></div>
        </div>

        <div id="gacha-panel" class="hidden w-full bg-white rounded-3xl shadow-xl border-4 border-purple-300 p-5 flex flex-col items-center justify-center min-h-[420px]">
            <h3 class="text-2xl text-purple-700 mb-1 font-bold">🔮 신비한 댕댕이 캡슐</h3>
            <p class="text-xs text-slate-500 mb-3 text-center">버튼을 <b>꾹~ 누르고 있으면</b><br>캡슐이 열리며 선물이 튀어나옵니다!</p>
            
            <div class="w-48 bg-slate-100 h-4 rounded-full overflow-hidden border border-purple-200 mb-3 relative">
                <div id="gacha-progress" class="progress-bar bg-purple-500 h-full w-0"></div>
            </div>

            <button id="gacha-btn" class="w-32 h-32 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 text-white text-xl shadow-lg border-4 border-purple-200 active:scale-95 transition-transform select-none cursor-pointer flex items-center justify-center flex-col font-bold">
                <span>꾹 누르기!</span>
            </button>

            <div id="gacha-result" class="mt-3 text-center text-xs font-bold text-purple-900 min-h-[40px]"></div>
        </div>
    </main>

    <footer class="text-xs text-slate-400 pb-1">&copy; 2026 댕댕이 미니게임 빌더.</footer>

    <div id="rate-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border-2 border-amber-400">
            <h4 class="text-lg font-bold text-center mb-3 text-amber-600">📊 캡슐 뽑기 확률표</h4>
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="border-b-2 border-slate-200 text-slate-500">
                        <th class="py-1.5">선물 리스트</th>
                        <th class="py-1.5 text-right">확률</th>
                    </tr>
                </thead>
                <tbody class="text-slate-700">
                    <tr class="border-b border-slate-100 text-red-600 font-bold"><td class="py-2">👑 2천원 이내의 원하는 것 (몰아서 쓰기 x)</td><td class="py-2 text-right">0.5%</td></tr>
                    <tr class="border-b border-slate-100 text-orange-600 font-bold"><td class="py-2">🍛 주인장이 밥 사줌</td><td class="py-2 text-right">1.0%</td></tr>
                    <tr class="border-b border-slate-100 text-amber-600 font-bold"><td class="py-2">💻 주인장한테 원하는 프로그램 말하면 만들어줌</td><td class="py-2 text-right">10.0%</td></tr>
                    <tr class="border-b border-slate-100 text-yellow-600"><td class="py-2">🍖 간식 1~2개</td><td class="py-2 text-right">20.0%</td></tr>
                    <tr class="text-slate-400"><td class="py-2">💨 꽝</td><td class="py-2 text-right">59.5%</td></tr>
                </tbody>
            </table>
            <button id="close-rate-btn" class="w-full mt-4 bg-slate-800 text-white py-2 rounded-xl text-sm font-bold">닫기</button>
        </div>
    </div>

    <div id="ticket-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border-2 border-purple-400 max-h-[80vh] flex flex-col">
            <h4 class="text-lg font-bold text-center mb-1 text-purple-700">🎟️ 내 상품 티켓 보관함</h4>
            <p class="text-[11px] text-center text-slate-500 mb-3">당첨된 상품은 화면을 캡처하여 주인장에게 보여주세요!</p>
            <div id="ticket-list-container" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
            <button id="close-ticket-btn" class="w-full mt-3 bg-slate-800 text-white py-2 rounded-xl text-sm font-bold">닫기</button>
        </div>
    </div>

    <script>
        const gameState = { stage: 1, maxStage: 3, level: 1, tickets: 0, myTickets: [], currentTab: 'game', gachaPressTimer: null, gachaProgressInterval: null, gachaHoldTime: 0, requiredHoldTime: 15 };
        const el = {
            levelDisplay: document.getElementById('level-display'), ticketDisplay: document.getElementById('ticket-display'), stageDisplay: document.getElementById('stage-display'), levelProgress: document.getElementById('level-progress'),
            tabGame: document.getElementById('tab-game'), tabGacha: document.getElementById('tab-gacha'),
            gamePanel: document.getElementById('game-panel'), gachaPanel: document.getElementById('gacha-panel'), gameContent: document.getElementById('game-content'), gameControls: document.getElementById('game-controls'),
            gachaBtn: document.getElementById('gacha-btn'), gachaProgress: document.getElementById('gacha-progress'), gachaResult: document.getElementById('gacha-result'), rateModal: document.getElementById('rate-modal'),
            showRateBtn: document.getElementById('show-rate-btn'), closeRateBtn: document.getElementById('close-rate-btn'),
            ticketModal: document.getElementById('ticket-modal'), showTicketBoxBtn: document.getElementById('show-ticket-box-btn'), closeTicketBtn: document.getElementById('close-ticket-btn'), ticketListContainer: document.getElementById('ticket-list-container')
        };

        function updateUI() {
            el.ticketDisplay.innerText = "🎟️ 뽑기권: " + gameState.tickets + "개";
            el.levelDisplay.innerText = "🐶 LV. " + gameState.level + " 모험";
            el.stageDisplay.innerText = gameState.stage + "단계 미션 진행중";
            el.levelProgress.style.width = ((gameState.stage - 1) / gameState.maxStage) * 100 + "%";
            if (gameState.myTickets.length > 0) {
                el.showTicketBoxBtn.classList.remove('hidden');
            } else {
                el.showTicketBoxBtn.classList.add('hidden');
            }
        }

        function switchTab(tab) {
            gameState.currentTab = tab;
            if (tab === 'game') {
                el.tabGame.className = "flex-1 py-2 rounded-xl bg-amber-500 text-white shadow-md text-base font-bold";
                el.tabGacha.className = "flex-1 py-2 rounded-xl bg-slate-200 text-slate-600 shadow-md text-base font-bold";
                el.gamePanel.classList.remove('hidden'); el.gachaPanel.classList.add('hidden');
            } else {
                el.tabGacha.className = "flex-1 py-2 rounded-xl bg-purple-600 text-white shadow-md text-base font-bold";
                el.tabGame.className = "flex-1 py-2 rounded-xl bg-slate-200 text-slate-600 shadow-md text-base font-bold";
                el.gamePanel.classList.add('hidden'); el.gachaPanel.classList.remove('hidden');
            }
        }
        el.tabGame.onclick = () => switchTab('game');
        el.tabGacha.onclick = () => switchTab('gacha');

        // 미니게임 3종 정의 (게임 1: 댕댕이 상식 퀴즈 챌린지)
        const games = {
            1: {
                title: "🐾 1단계: 댕댕이 상식 퀴즈 챌린지", 
                desc: "총 <b>3문제</b>의 퀴즈를 모두 맞히세요!<br>틀리면 처음부터 다시 도전합니다.",
                start: function(onClear) {
                    const quizList = [
                        { q: "강아지는 단맛보다 짠맛을 더 강하게 느낀다?", answer: false, hint: "강아지는 짠맛보다 단맛/신맛에 민감해요!" },
                        { q: "강아지가 꼬리를 흔드는 것은 무조건 기분 좋다는 뜻이다?", answer: false, hint: "경계하거나 긴장할 때도 흔들 수 있어요!" },
                        { q: "강아지의 후각은 사람보다 수만~수백만 배 뛰어나다?", answer: true, hint: "정답입니다! 냄새를 아주 잘 맡아요." }
                    ];
                    let currentQuizIdx = 0;

                    function showQuiz() {
                        if (currentQuizIdx >= quizList.length) {
                            onClear();
                            return;
                        }
                        const qObj = quizList[currentQuizIdx];
                        el.gameContent.innerHTML = '<div class="text-sm font-bold mb-1">' + games[1].title + '</div>' +
                            '<div class="text-xs text-slate-500 mb-3">문제 ' + (currentQuizIdx + 1) + ' / 3</div>' +
                            '<div class="bg-amber-50 p-4 rounded-xl border border-amber-200 mb-4 text-base font-bold text-slate-700 min-h-[70px] flex items-center justify-center">' + qObj.q + '</div>';

                        el.gameControls.innerHTML = '';
                        const btnO = document.createElement('button');
                        btnO.className = "w-full bg-green-500 text-white font-bold py-3 rounded-xl text-base shadow-md active:scale-95 mb-2";
                        btnO.innerText = "⭕ O (맞음)";
                        btnO.onclick = () => checkAnswer(true);
