<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>댕댕이의 미니게임 천국</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; }
        .progress-bar { transition: width 0.1s linear; }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-amber-200">

    <header class="w-full max-w-md bg-white rounded-2xl shadow-md p-4 text-center border-2 border-amber-200 relative">
        <button id="show-rate-btn" class="absolute top-3 right-3 text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-lg hover:bg-amber-200">📊 확률표</button>
        <div class="flex justify-between items-center mb-2 pr-12">
            <span id="level-display" class="text-2xl text-amber-600 font-bold">🐶 LV. 1 모험</span>
            <span id="ticket-display" class="text-sm bg-purple-100 text-purple-700 font-bold px-3 py-1 rounded-full">🎟️ 뽑기권: 0개</span>
        </div>
        <div class="flex justify-between items-center text-sm text-slate-500 mb-1">
            <span id="stage-display">1단계 미션 진행중</span>
        </div>
        <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden border border-slate-300">
            <div id="level-progress" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-4">
        <div id="tab-container" class="w-full flex gap-2 mb-4">
            <button id="tab-game" class="flex-1 py-2 rounded-xl bg-amber-500 text-white shadow-md text-lg">🎮 게임 플레이</button>
            <button id="tab-gacha" class="flex-1 py-2 rounded-xl bg-slate-200 text-slate-600 shadow-md text-lg">🔮 캡슐 뽑기</button>
        </div>

        <div id="game-panel" class="w-full bg-white rounded-3xl shadow-xl border-4 border-amber-300 p-6 flex flex-col items-center justify-between min-h-[420px]">
            <div id="game-content" class="w-full flex-1 flex flex-col items-center justify-center text-center"></div>
            <div id="game-controls" class="w-full mt-4 flex flex-col gap-2 justify-center"></div>
        </div>

        <div id="gacha-panel" class="hidden w-full bg-white rounded-3xl shadow-xl border-4 border-purple-300 p-6 flex flex-col items-center justify-center min-h-[420px]">
            <h3 class="text-2xl text-purple-700 mb-2 font-bold">🔮 신비한 댕댕이 캡슐</h3>
            <p class="text-sm text-slate-500 mb-4 text-center">버튼을 <b>꾹~ 누르고 있으면</b><br>캡슐이 열리며 선물이 튀어나옵니다!</p>
            
            <div class="w-48 bg-slate-100 h-5 rounded-full overflow-hidden border border-purple-200 mb-4 relative">
                <div id="gacha-progress" class="progress-bar bg-purple-500 h-full w-0"></div>
            </div>

            <button id="gacha-btn" class="w-36 h-36 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 text-white text-2xl shadow-lg border-4 border-purple-200 active:scale-95 transition-transform select-none cursor-pointer flex items-center justify-center flex-col">
                <span>꾹 누르기!</span>
            </button>

            <div id="gacha-result" class="mt-4 text-center text-base font-bold text-purple-900 min-h-[40px]"></div>
        </div>
    </main>

    <footer class="text-xs text-slate-400 pb-2">&copy; 2026 댕댕이 미니게임 빌더.</footer>

    <div id="rate-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border-2 border-amber-400">
            <h4 class="text-xl font-bold text-center mb-4 text-amber-600">📊 캡슐 뽑기 확률표</h4>
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="border-b-2 border-slate-200 text-slate-500">
                        <th class="py-2">선물 리스트</th>
                        <th class="py-2 text-right">확률</th>
                    </tr>
                </thead>
                <tbody class="text-slate-700">
                    <tr class="border-b border-slate-100 text-red-600 font-bold"><td class="py-2">👑 5천원 이내 원하는 것 (깊카/문상불가)</td><td class="py-2 text-right">0.5%</td></tr>
                    <tr class="border-b border-slate-100 text-orange-600 font-bold"><td class="py-2">🍛 주인장이 밥 사줌</td><td class="py-2 text-right">5.0%</td></tr>
                    <tr class="border-b border-slate-100 text-amber-600 font-bold"><td class="py-2">💻 주인장이 원하는 프로그램 만들어 줌</td><td class="py-2 text-right">14.5%</td></tr>
                    <tr class="border-b border-slate-100 text-yellow-600"><td class="py-2">🍖 간식 (1~2개)</td><td class="py-2 text-right">20.0%</td></tr>
                    <tr class="text-slate-400"><td class="py-2">💨 꽝 (위로 한마디)</td><td class="py-2 text-right">60.0%</td></tr>
                </tbody>
            </table>
            <button id="close-rate-btn" class="w-full mt-6 bg-slate-800 text-white py-2 rounded-xl text-sm">닫기</button>
        </div>
    </div>

    <script>
        const gameState = { stage: 1, maxStage: 3, level: 1, tickets: 0, currentTab: 'game', gachaPressTimer: null, gachaProgressInterval: null, gachaHoldTime: 0, requiredHoldTime: 15 };
        const el = {
            levelDisplay: document.getElementById('level-display'), ticketDisplay: document.getElementById('ticket-display'), stageDisplay: document.getElementById('stage-display'), levelProgress: document.getElementById('level-progress'),
            tabGame: document.getElementById('tab-game'), tabGacha: document.getElementById('tab-gacha'),
            gamePanel: document.getElementById('game-panel'), gachaPanel: document.getElementById('gacha-panel'), gameContent: document.getElementById('game-content'), gameControls: document.getElementById('game-controls'),
            gachaBtn: document.getElementById('gacha-btn'), gachaProgress: document.getElementById('gacha-progress'), gachaResult: document.getElementById('gacha-result'), rateModal: document.getElementById('rate-modal'),
            showRateBtn: document.getElementById('show-rate-btn'), closeRateBtn: document.getElementById('close-rate-btn')
        };

        function updateUI() {
            el.ticketDisplay.innerText = "🎟️ 뽑기권: " + gameState.tickets + "개";
            el.levelDisplay.innerText = "🐶 LV. " + gameState.level + " 모험";
            el.stageDisplay.innerText = gameState.stage + "단계 미션 진행중";
            el.levelProgress.style.width = ((gameState.stage - 1) / gameState.maxStage) * 100 + "%";
        }

        function switchTab(tab) {
            gameState.currentTab = tab;
            if (tab === 'game') {
                el.tabGame.className = "flex-1 py-2 rounded-xl bg-amber-500 text-white shadow-md text-lg";
                el.tabGacha.className = "flex-1 py-2 rounded-xl bg-slate-200 text-slate-600 shadow-md text-lg";
                el.gamePanel.classList.remove('hidden'); el.gachaPanel.classList.add('hidden');
            } else {
                el.tabGacha.className = "flex-1 py-2 rounded-xl bg-purple-600 text-white shadow-md text-lg";
                el.tabGame.className = "flex-1 py-2 rounded-xl bg-slate-200 text-slate-600 shadow-md text-lg";
                el.gamePanel.classList.add('hidden'); el.gachaPanel.classList.remove('hidden');
            }
        }
        el.tabGame.onclick = () => switchTab('game');
        el.tabGacha.onclick = () => switchTab('gacha');

        // 게임 스테이지 상세 구현
        const games = {
            1: {
                title: "🐾 1단계: 간식 배달 대작전", 
                desc: "강아지는 <b>오른쪽</b>으로 이동하고, 장애물은 <b>왼쪽</b>에서 다가옵니다!<br>타이밍에 맞춰 점프하여 장애물을 피하고 살아남으세요!",
                start: function(onClear) {
                    // 레벨별 버티기 시간: 기본 30초, 레벨당 30초 추가
                    let targetSeconds = 30 * gameState.level;
                    let timeLeft = targetSeconds;
                    let isJumping = false;
                    let isDoubleJumping = false;
                    let lastJumpTime = 0;

                    el.gameContent.innerHTML = '<div class="text-base font-bold mb-1">' + this.title + '</div>' +
                        '<div class="text-xs text-slate-500 mb-3">' + this.desc + '</div>' +
                        '<div class="relative w-full h-24 bg-amber-100 rounded-xl overflow-hidden mb-3 border border-amber-200 flex items-end px-4">' +
                            '<div id="dog-run" class="text-3xl transition-all duration-150 absolute bottom-2 left-10">🐕</div>' +
                            '<div id="obs-run" class="text-2xl absolute bottom-2 right-6 animate-pulse">🪵</div>' +
                        '</div>' +
                        '<div class="text-lg font-bold text-amber-600 mb-1">⏳ 남은 버티기 시간: <span id="time-left">' + timeLeft + '</span>초 (레벨 ' + gameState.level + ')</div>';

                    el.gameControls.innerHTML = '';
                    const btn = document.createElement('button');
                    btn.className = "w-full bg-amber-500 text-white font-bold py-3 rounded-xl text-lg shadow-md active:scale-95";
                    btn.innerText = "🦘 점프하기 (더블 점프 가능)";
                    
                    btn.onclick = () => {
                        const now = Date.now();
                        const dog = document.getElementById('dog-run');
                        if (!isJumping) {
                            isJumping = true;
                            lastJumpTime = now;
                            dog.style.bottom = "35px";
                            setTimeout(() => { if(!isDoubleJumping) { dog.style.bottom = "8px"; isJumping = false; } }, 300);
                        } else if (isJumping && !isDoubleJumping && (now - lastJumpTime < 350)) {
                            isDoubleJumping = true;
                            dog.style.bottom = "70px";
                            setTimeout(() => { dog.style.bottom = "8px"; isJumping = false; isDoubleJumping = false; }, 400);
                        }
                    };
                    el.gameControls.appendChild(btn);

                    const timer = setInterval(() => {
                        timeLeft--;
                        const tEl = document.getElementById('time-left');
                        if (tEl) tEl.innerText = timeLeft;

                        if (timeLeft <= 0) {
                            clearInterval(timer);
                            btn.onclick = null;
                            onClear();
                        }
                    }, 1000);
                }
            },
            2: {
                title: "👨‍🍳 2단계: 뭉치의 멍멍 셰프", 
                desc: "<b>안내:</b> 담아야 하는 재료는 그릇이 <b>금색(🏆골든 그릇)</b>입니다!<br>지나가는 재료 중 골든 그릇만 골라 정확히 3번 담으세요!<br>(썩은 음식이나 빈 그릇은 피하세요)",
                start: function(onClear) {
                    let successCount = 0;
                    const target = 3;
                    // 레벨별 속도 배율 (레벨 1: 1초, 레벨 2: 3배 빠르게 등)
                    let speedMultiplier = gameState.level === 1 ? 1 : (gameState.level === 2 ? 3 : 5);
                    
                    const itemPool = [
                        { name: "🏆 금색 뼈다귀 그릇", isGold: true },
                        { name: "☠️ 썩은 고기 그릇", isGold: false },
                        { name: "🫙 텅 빈 그릇", isGold: false },
                        { name: "🏆 금색 프리미엄 간식 그릇", isGold: true }
                    ];

                    let currentItem = itemPool[0];

                    el.gameContent.innerHTML = '<div class="text-sm font-bold mb-1">' + this.title + '</div>' +
                        '<div class="text-xs text-slate-500 mb-2">' + this.desc + '</div>' +
                        '<div class="bg-purple-50 p-3 rounded-xl border border-purple-200 mb-3">' +
                            '<div class="text-xs text-purple-700 font-bold mb-1">현재 다가오는 그릇 (속도 배율: x' + speedMultiplier + ')</div>' +
                            '<div id="bowl-box" class="text-xl font-black text-amber-600 animate-pulse">' + currentItem.name + '</div>' +
                        '</div>' +
                        '<div class="text-sm font-bold text-slate-700">골든 그릇 수집: <span id="bowl-count">0</span> / 3</div>';

                    el.gameControls.innerHTML = '';
                    const btn = document.createElement('button');
                    btn.className = "w-full bg-purple-600 text-white font-bold py-3 rounded-xl text-lg shadow-md active:scale-95";
                    btn.innerText = "📥 그릇 담기 (금색만 클릭!)";
                    
                    btn.onclick = () => {
                        if (currentItem.isGold) {
                            successCount++;
                            document.getElementById('bowl-count').innerText = successCount;
                            if (successCount >= target) {
                                clearInterval(itemMover);
                                btn.onclick = null;
                                onClear();
                                return;
                            }
                        } else {
                            alert("앗! 썩었거나 빈 그릇을 담았습니다! 다시 시도하세요.");
                        }
                        // 다음 아이템 랜덤 갱신
                        currentItem = itemPool[Math.floor(Math.random() * itemPool.length)];
                        document.getElementById('bowl-box').innerText = currentItem.name;
                    };
                    el.gameControls.appendChild(btn);

                    // 레벨별 속도에 맞춰 자동으로 아이템이 지나가는 인터벌 시뮬레이션
                    let intervalTime = 2000 / speedMultiplier;
                    const itemMover = setInterval(() => {
                        currentItem = itemPool[Math.floor(Math.random() * itemPool.length)];
                        const bBox = document.getElementById('bowl-box');
                        if (bBox) bBox.innerText = currentItem.name;
                    }, intervalTime);
                }
            },
            3: {
                title: "🚩 3단계: 우리 동네 댕댕이 대장", 
                desc: "AI 상대와 연타 대결!<br>레벨 1은 40초 안에 20점을 얻어야 합니다.<br>(레벨업 시 제한시간 5초 단축 & 목표 점수 5점 증가)",
                start: function(onClear) {
                    // 레벨별 설정: 레벨 1(40초, 20점), 레벨 2(35초, 25점), 레벨 3(30초, 30점)...
                    let timeLimit = 40 - (gameState.level - 1) * 5;
                    let targetScore = 20 + (gameState.level - 1) * 5;
                    
                    let myScore = 0;
                    let aiScore = 0;
                    let gameActive = true;

                    el.gameContent.innerHTML = '<div class="text-sm font-bold mb-1">' + this.title + '</div>' +
                        '<div class="text-xs text-slate-500 mb-2">' + this.desc + '</div>' +
                        '<div class="flex justify-around items-center bg-amber-50 p-2 rounded-xl border border-amber-200 mb-2 text-xs font-bold">' +
                            '<div>🐶 나: <span id="my-sc" class="text-amber-600 text-base">0</span>/' + targetScore + '점</div>' +
                            '<div>⏳ 제한시간: <span id="time-sc" class="text-red-500 text-base">' + timeLimit + '</span>초</div>' +
                            '<div>🤖 AI: <span id="ai-sc" class="text-slate-600 text-base">0</span>점</div>' +
                        '</div>' +
                        '<div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden relative">' +
                            '<div id="battle-bar" class="bg-amber-500 h-full w-[50%] transition-all"></div>' +
                        '</div>';

                    // AI 점수 상승 루프 (레벨이 높을수록 AI가 더 빠르게 점수를 올림)
                    let aiSpeed = 300 - (gameState.level - 1) * 50;
                    const aiInterval = setInterval(() => {
                        if (!gameActive) return;
                        aiScore += 1;
                        if(aiScore > targetScore) aiScore = targetScore;
                        const aiEl = document.getElementById('ai-sc');
                        if(aiEl) aiEl.innerText = aiScore;

                        if (aiScore >= targetScore && myScore < targetScore) {
                            gameActive = false;
                            clearInterval(aiInterval);
                            clearInterval(countDownTimer);
                            alert("AI가 먼저 목표 점수를 달성했습니다! 다시 도전해 주세요.");
                            loadStage();
                        }
                    }, Math.max(aiSpeed, 100));

                    // 전체 제한시간 타이머
                    const countDownTimer = setInterval(() => {
                        if (!gameActive) return;
                        timeLimit--;
                        const tEl = document.getElementById('time-sc');
                        if(tEl) tEl.innerText = timeLimit;

                        if (timeLimit <= 0 && myScore < targetScore) {
                            gameActive = false;
                            clearInterval(aiInterval);
                            clearInterval(countDownTimer);
                            alert("시간 초과! 패배했습니다. 다시 도전하세요.");
                            loadStage();
                        }
                    }, 1000);

                    el.gameControls.innerHTML = '';
                    const btn = document.createElement('button');
                    btn.className = "w-full bg-amber-500 text-white font-bold py-4 rounded-xl text-xl shadow-md active:scale-95";
                    btn.innerText = "🔥 빛의 속도로 연타하기!";
                    
                    btn.onclick = () => {
                        if (!gameActive) return;
                        myScore++;
                        const myEl = document.getElementById('my-sc');
                        if(myEl) myEl.innerText = myScore;

                        let ratio = (myScore / (myScore + aiScore || 1)) * 100;
                        const bar = document.getElementById('battle-bar');
                        if(bar) bar.style.width = ratio + '%';

                        if (myScore >= targetScore) {
                            gameActive = false;
                            clearInterval(aiInterval);
                            clearInterval(countDownTimer);
                            btn.onclick = null;
                            onClear();
                        }
                    };
                    el.gameControls.appendChild(btn);
                }
            }
        };

        function loadStage() {
            updateUI();
            if (gameState.stage > gameState.maxStage) {
                // 3단계 모두 클리어 시 뽑기권 2장 지급 및 난이도 레벨 업!
                gameState.tickets += 2;
                gameState.level += 1;
                gameState.stage = 1;
                updateUI();
                
                el.gameContent.innerHTML = '<div class="text-2xl font-bold text-orange-600 mb-2">🎉 모든 모험 클리어! 🎉</div>' +
                    '<p class="text-slate-600 mb-1">보상으로 <b>🔮 뽑기권 2장</b>이 지급되었습니다!</p>' +
                    '<p class="text-xs text-purple-600 font-bold mb-2">난이도가 상승하여 LV.' + gameState.level + ' 모험이 시작됩니다!</p>' +
                    '<div class="text-3xl my-2">🎟️✨🎟️</div>';
                el.gameControls.innerHTML = '';
                const b = document.createElement('button');
                b.className = "w-full bg-purple-600 text-white font-bold py-3 rounded-xl text-lg shadow-md";
                b.innerText = "뽑기 하러 가기 (탭 이동)";
                b.onclick = () => switchTab('gacha');
                el.gameControls.appendChild(b);
                return;
            }

            games[gameState.stage].start(() => {
                el.gameContent.innerHTML = '<div class="text-2xl font-bold text-green-600 mb-2">Stage Clear! ✨</div>' +
                    '<p class="text-slate-600">멋지게 단계를 돌파했습니다!</p><div class="text-4xl my-2">🐾</div>';
                el.gameControls.innerHTML = '';
                const b = document.createElement('button');
                b.className = "w-full bg-green-500 text-white font-bold py-3 rounded-xl text-lg shadow-md";
                b.innerText = "다음 단계로 이동";
                b.onclick = () => {
                    gameState.stage++;
                    loadStage();
                };
                el.gameControls.appendChild(b);
            });
        }

        // 캡슐 뽑기 로직
        function startPress() {
            if (gameState.tickets <= 0) {
                el.gachaResult.innerText = "🎟️ 뽑기권이 부족합니다! 게임을 모두 클리어하고 오세요!";
                el.gachaResult.className = "mt-4 text-center text-sm font-bold text-red-500 min-h-[40px]";
                return;
            }

            gameState.gachaHoldTime = 0; el.gachaResult.innerText = ""; el.gachaProgress.style.width = '0%';
            gameState.gachaProgressInterval = setInterval(() => {
                gameState.gachaHoldTime++;
                let pct = (gameState.gachaHoldTime / gameState.requiredHoldTime) * 100;
                el.gachaProgress.style.width = Math.min(pct, 100) + '%';
                if (gameState.gachaHoldTime >= gameState.requiredHoldTime) clearInterval(gameState.gachaProgressInterval);
            }, 100);
            gameState.gachaPressTimer = setTimeout(triggerGacha, gameState.requiredHoldTime * 100);
        }

        function cancelPress() {
            clearTimeout(gameState.gachaPressTimer); clearInterval(gameState.gachaProgressInterval);
            if (gameState.tickets > 0 && gameState.gachaHoldTime < gameState.requiredHoldTime) {
                el.gachaProgress.style.width = '0%'; 
                el.gachaResult.innerText = "조금 더 길게 꾹 누르고 계세요!";
                el.gachaResult.className = "mt-4 text-center text-sm font-bold text-red-500 min-h-[40px]";
            }
        }

        async function triggerGacha() {
            if (gameState.tickets <= 0) return;
            gameState.tickets--;
            updateUI();

            const rand = Math.random() * 100;
            let prize = ""; let isWin = true;

            // 수정된 확률 반영 (0.5%, 5%, 14.5%, 20%, 60%)
            if (rand < 0.5) {
                prize = "👑 [0.5%] 대박! 5천원 이내의 원하는 것 (깊카/문상 불가)";
            } else if (rand < 5.5) {
                prize = "🍛 [5.0%] 축하합니다! 주인장이 밥 사줌!";
            } else if (rand < 20.0) {
                prize = "💻 [14.5%] 대박! 주인장이 원하는 프로그램 만들어 줌!";
            } else if (rand < 40.0) {
                prize = "🍖 [20.0%] 맛있는 간식 (1~2개) 획득!";
            } else {
                prize = "꽝"; isWin = false;
            }

            if (isWin) {
                el.gachaResult.innerText = prize; 
                el.gachaResult.className = "mt-4 text-center text-base font-bold text-orange-600 min-h-[40px]";
            } else {
                el.gachaResult.innerText = "🐾 꽝! 댕댕이가 위로 한마디 쓰는 중...";
                el.gachaResult.className = "mt-4 text-center text-sm font-bold text-slate-500 min-h-[40px]";
                try {
                    const response = await fetch('/api/generate');
                    const data = await response.json();
                    el.gachaResult.innerText = '💨 꽝! 댕댕이의 한마디:\n"' + data.message + '"';
                } catch (err) {
                    el.gachaResult.innerText = "💨 꽝! 힘내라 멍! (다음 기회에)";
                }
            }
        }

        el.gachaBtn.addEventListener('mousedown', startPress);
        el.gachaBtn.addEventListener('mouseup', cancelPress);
        el.gachaBtn.addEventListener('mouseleave', cancelPress);
        el.gachaBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        el.gachaBtn.addEventListener('touchend', (e) => { e.preventDefault(); cancelPress(); });

        el.showRateBtn.onclick = () => el.rateModal.className = "fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50";
        el.closeRateBtn.onclick = () => el.rateModal.className = "fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50";

        loadStage();
    </script>
</body>
</html>
